name: Build standalone applications

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - linux-x64
          - windows-x64
          - macos-arm64
          - macos-intel
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  linux-x64:
    name: Linux x64
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux-x64' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-packaging.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev python3-tk tk8.6-dev

      - name: Install Python packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-packaging.txt

      - name: 1. Compile native solver
        run: python build_solver.py --clean

      - name: 2. Build standalone application
        run: python package_app.py --skip-solver-build --clean

      - name: Archive Linux application
        run: tar -czf AnalyticMagneticField-linux-x64.tar.gz -C dist AnalyticMagneticField

      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          name: AnalyticMagneticField-linux-x64
          path: AnalyticMagneticField-linux-x64.tar.gz
          if-no-files-found: error

  windows-x64:
    name: Windows x64
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows-x64' }}
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-packaging.txt

      - name: Install Boost headers
        shell: pwsh
        run: |
          choco install boost-msvc-14.3 --version=1.87.0 -y --no-progress
          $boost = Get-ChildItem C:\local -Directory -Filter 'boost_*' | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $boost) { throw 'Boost installation was not found under C:\local.' }
          "BOOST_ROOT=$($boost.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BOOST_ROOT=$($boost.FullName)"

      - name: Install Python packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-packaging.txt

      - name: 1. Compile native solver
        run: python build_solver.py --clean

      - name: 2. Build standalone application
        run: python package_app.py --skip-solver-build --clean

      - name: Archive Windows application
        shell: pwsh
        run: Compress-Archive -Path dist\AnalyticMagneticField -DestinationPath AnalyticMagneticField-windows-x64.zip -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: AnalyticMagneticField-windows-x64
          path: AnalyticMagneticField-windows-x64.zip
          if-no-files-found: error

  macos-arm64:
    name: macOS Apple Silicon
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos-arm64' }}
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-packaging.txt

      - name: Install Boost headers
        run: brew install boost

      - name: Install Python packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-packaging.txt

      - name: 1. Compile native solver
        run: python build_solver.py --clean

      - name: 2. Build standalone application
        run: python package_app.py --skip-solver-build --clean

      - name: Archive macOS application
        run: ditto -c -k --sequesterRsrc --keepParent dist/AnalyticMagneticField.app AnalyticMagneticField-macos-arm64.zip

      - name: Upload macOS Apple Silicon build
        uses: actions/upload-artifact@v7
        with:
          name: AnalyticMagneticField-macos-arm64
          path: AnalyticMagneticField-macos-arm64.zip
          if-no-files-found: error

  macos-intel:
    name: macOS Intel
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos-intel' }}
    runs-on: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-packaging.txt

      - name: Install Boost headers
        run: brew install boost

      - name: Install Python packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-packaging.txt

      - name: 1. Compile native solver
        run: python build_solver.py --clean

      - name: 2. Build standalone application
        run: python package_app.py --skip-solver-build --clean

      - name: Archive macOS application
        run: ditto -c -k --sequesterRsrc --keepParent dist/AnalyticMagneticField.app AnalyticMagneticField-macos-intel.zip

      - name: Upload macOS Intel build
        uses: actions/upload-artifact@v7
        with:
          name: AnalyticMagneticField-macos-intel
          path: AnalyticMagneticField-macos-intel.zip
          if-no-files-found: error
